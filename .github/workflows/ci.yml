name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.5"
  TZ: America/Mexico_City

jobs:
  packages:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Un solo job: evita 7 descargas paralelas de subosito/flutter-action,
      # que GitHub responde con 429 (Too Many Requests) en codeload.
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze and test
        run: |
          set -euo pipefail
          failed=()
          for pkg in \
            packages/posia_core \
            packages/posia_database \
            packages/posia_hardware \
            packages/posia_pricing \
            packages/posia_sync \
            packages/posia_ui \
            apps/posia_pos
          do
            echo "::group::${pkg}"
            if (
              cd "$pkg"
              flutter pub get
              dart analyze .
              flutter test
            ); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed+=("$pkg")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Fallaron: ${failed[*]}"
            exit 1
          fi

  server:
    name: Sync API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/sync_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze .

      - name: Test
        run: dart test
